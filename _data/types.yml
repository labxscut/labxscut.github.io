# map general type to default/fallback icon, text, etc.
#
# Only keys reachable from the live site are kept:
#   * footer.html iterates site.links -> email, github, google-scholar
#   * explicit {% include button.html type=... %} callers -> external, orcid,
#     docs, source
# The member role keys (principal-investigator, postdoc, phd, ...) were dropped
# because portrait.html looks up site.data.types[member.role] and no role string
# in _data/people.yml ever matches a key here, so the lookup always returned nil.

email:
  icon: fa-solid fa-envelope
  text: Email
  tooltip: Email
  link: mailto:$VALUE

github:
  icon: fa-brands fa-github
  text: GitHub
  tooltip: GitHub
  link: https://github.com/$VALUE

google-scholar:
  icon: fa-brands fa-google
  text: Google Scholar
  tooltip: Google Scholar
  link: https://scholar.google.com/citations?user=$VALUE

external:
  icon: fa-solid fa-up-right-from-square
  text: External Link
  tooltip: External link

orcid:
  icon: fa-brands fa-orcid
  text: ORCID
  tooltip: ORCID
  link: https://orcid.org/$VALUE

docs:
  icon: fa-solid fa-book
  text: Documentation
  tooltip: Documentation

source:
  icon: fa-solid fa-code
  text: Source
  tooltip: Source code
