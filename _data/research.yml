# Research themes, phrased from the group's own tools and records.
- key: single-cell
  title: Single-cell and multi-omics integration
  icon: "🕸"
  summary: >-
    Fusing modality-specific single-cell measurements into one coherent view,
    using geometry-anchored similarity network fusion and self-supervised graph
    learning.
  keywords: [single-cell, multi-omics, graph learning, SNF]
  tools: [sxSNF]

- key: protein
  title: Protein and enzyme function prediction
  icon: "🧪"
  summary: >-
    Sequence-based prediction of enzyme function, from rapid binary enzyme
    screening to hierarchical EC-class assignment and contrastive embeddings.
  keywords: [enzyme, EC number, sequence features, XGBoost]
  tools: [sxLaep]

- key: cancer
  title: Cancer genomics and liquid biopsy
  icon: "🩸"
  summary: >-
    Deep learning on cfDNA methylation sequencing and tumour methylation arrays
    to detect tumour-derived fragments and score cancer risk from a blood draw.
  keywords: [cfDNA, methylation, deep learning, early detection]
  tools: [deeplb]

- key: methods
  title: Statistical and machine-learning methodology
  icon: "📐"
  summary: >-
    The statistics behind the tools: distribution shift, estimable learning
    bounds, local genetic association, and survival learning across databases.
  keywords: [distribution shift, learning bounds, local association, survival]
  tools: []

