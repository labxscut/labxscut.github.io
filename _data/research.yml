# Public research directions. Keep keywords concise and attach only verified
# publication slugs from publications.yml with a factual, plain-language note.
- key: ai-theory
  title: AI theory and learning methodology
  summary: >-
    We study the principles behind reliable learning: generalization bounds,
    domain transfer under distribution shift, hierarchical learning, and
    multi-model and multimodal learning.
  keywords:
    - learning bounds
    - domain transfer
    - distribution shift
    - hierarchical learning
    - multi-model learning
    - multimodal learning
  selected_papers:
    - slug: ChenICML25DshiftShort
      narrative: >-
        Develops an estimable learning bound that unifies covariate and concept
        shift, connecting distribution-shift analysis with generalization.

- key: biomedical-ai
  title: AI for biomedical sciences
  summary: >-
    We develop AI methods for enzyme-function prediction, single-cell
    genomics, metagenomic and phylogenomic analysis, and clinical data.
  keywords:
    - enzyme function prediction
    - single-cell genomics
    - multi-omics
    - metagenomics
    - phylogenomics
    - clinical sciences
  selected_papers:
    - slug: DuanISBRA2025EnzHier
      narrative: >-
        Integrates multi-scale protein-sequence features with hierarchical
        contrastive learning to predict enzyme function.
    - slug: Duan2025sxSNF
      narrative: >-
        Combines similarity-network fusion with deep graph learning to
        integrate multimodal single-cell measurements.
    - slug: Feishu-2023-Ksak-A-high-throughput-tool-for-alignment-free
      narrative: >-
        Presents a high-throughput alignment-free phylogenetics tool, relevant
        to scalable analysis of microbial sequence data.
    - slug: YuHGGadv2025MtagHF
      narrative: >-
        Uses multi-trait genome-wide analysis to identify heart-failure risk
        loci and candidate drugs.
    - slug: ChangTCBB2025UGESdeng
      narrative: >-
        Combines genetic and epigenetic signals with hierarchical learning to
        predict breast-cancer intrinsic subtypes from DNA-level multi-omics.

- key: materials-and-frontiers
  title: AI for materials science and emerging fields
  summary: >-
    We aim to extend AI-for-science methods to materials science and other
    cutting-edge research fields, in collaboration with domain experts.
  keywords:
    - materials science
    - scientific machine learning
    - emerging research fields
  selected_papers: []
