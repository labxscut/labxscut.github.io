    early cancer detection from cfDNA methylation sequencing.
  version: ""
  language: Python, R
  license: ""
  repo: https://github.com/labxscut/DeepLB
  docs: https://labxscut.github.io/deeplb/
  tags: [cfDNA methylation, deep learning, cancer detection]
  maintainers: [lyi, kxf]
  paper: ""

