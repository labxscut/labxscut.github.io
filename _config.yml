# LabX site configuration, using the Greene Lab Website Template.
title: LabX
subtitle: AI for Science · SCUT
description: >-
  LabX is an AI-for-Science group at the School of Mathematics, South China
  University of Technology. We build machine-learning methods for genomes,
  proteins, single cells, and clinical data.
url: https://labxscut.github.io
baseurl: ""

links:
  email: lcxia@scut.edu.cn
  github: labxscut
  google-scholar: e1GOPw0AAAAJ

defaults:
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

highlighter: rouge
theme: null

sass:
  sass_dir: _styles

include:
  - _styles
  - _scripts

# Everything below stays tracked in git but is NOT published to the site.
exclude:
  - README.md
  - AGENTS.md
  - todo.md
  - 0design
  - 1chats
  - LICENSE
  - LICENSE-LWT.md
  - CITATION-LWT.cff
  - _generators
  - scripts
  - Gemfile
  - Gemfile.lock
  - requirements.txt
