<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="LabX research motif: a DNA double helix intertwined with a network of data nodes">
  <defs>
    <linearGradient id="strand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4aa3d8"/>
      <stop offset="1" stop-color="#79b9ff"/>
    </linearGradient>
  </defs>
  <!-- double helix strands -->
  <path d="M20 110 C 70 20, 130 20, 180 110 S 290 200, 340 110 S 450 20, 500 110 S 610 200, 620 150"
        fill="none" stroke="url(#strand)" stroke-width="7" stroke-linecap="round"/>
  <path d="M20 110 C 70 200, 130 200, 180 110 S 290 20, 340 110 S 450 200, 500 110 S 610 20, 620 70"
        fill="none" stroke="#2e7fb0" stroke-width="7" stroke-linecap="round"/>
  <!-- rungs -->
  <g stroke="#79b9ff" stroke-width="3" opacity="0.75">
    <line x1="60" y1="62" x2="60" y2="158"/>
    <line x1="100" y1="40" x2="100" y2="180"/>
    <line x1="140" y1="52" x2="140" y2="168"/>
    <line x1="220" y1="152" x2="220" y2="68"/>
    <line x1="260" y1="176" x2="260" y2="44"/>
    <line x1="300" y1="152" x2="300" y2="68"/>
    <line x1="380" y1="62" x2="380" y2="158"/>
    <line x1="420" y1="40" x2="420" y2="180"/>
    <line x1="460" y1="52" x2="460" y2="168"/>
    <line x1="540" y1="150" x2="540" y2="70"/>
    <line x1="580" y1="168" x2="580" y2="52"/>
  </g>
  <!-- data nodes (theme-adaptive neutrals + lab accent colors) -->
  <g>
    <circle cx="100" cy="40" r="9" fill="#f2b134"/>
    <circle cx="260" cy="176" r="9" fill="#58c26a"/>
    <circle cx="420" cy="40" r="9" fill="#d678c8"/>
    <circle cx="580" cy="168" r="9" fill="#79b9ff"/>
    <circle cx="180" cy="110" r="7" fill="currentColor"/>
    <circle cx="340" cy="110" r="7" fill="currentColor"/>
    <circle cx="500" cy="110" r="7" fill="currentColor"/>
  </g>
  <!-- connecting graph edges (theme-adaptive) -->
  <g stroke="currentColor" stroke-width="2" opacity="0.45">
    <line x1="100" y1="40" x2="180" y2="110"/>
    <line x1="260" y1="176" x2="340" y2="110"/>
    <line x1="420" y1="40" x2="500" y2="110"/>
    <line x1="340" y1="110" x2="420" y2="40"/>
  </g>
</svg>
